<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Privacy &amp; shared editing — fictional sample</title>
<desc id="desc">Privacy &amp; shared editing. Sample LGU. Illustrated preview · fictional records. All names, numbers, maps and dates are examples.</desc>
<g font-family="Inter, Arial, sans-serif" font-variant-numeric="tabular-nums">
<rect x="0" y="0" width="960" height="600" rx="0" fill="#f8faf8"/><rect x="0" y="0" width="960" height="6" rx="0" fill="#236344"/><rect x="748" y="0" width="212" height="6" rx="0" fill="#facc15"/>
<rect x="0" y="6" width="960" height="64" rx="0" fill="#ffffff"/><text x="36" y="46" font-size="28" fill="#236344" font-weight="750" >AgriLGU</text><line x1="185" y1="23" x2="185" y2="53" stroke="#dfe7e1" stroke-width="2" /><text x="207" y="43" font-size="18" fill="#607269" font-weight="550" >Sample LGU</text><rect x="768" y="22" width="156" height="32" rx="7" fill="#fff8d6"/><text x="780" y="44" font-size="17" fill="#20362c" font-weight="650" >SAMPLE DATA</text>
<line x1="0" y1="70" x2="960" y2="70" stroke="#dfe7e1" stroke-width="2" /><text x="36" y="113" font-size="29" fill="#20362c" font-weight="700" >Privacy &amp; shared editing</text><text x="36" y="143" font-size="17" fill="#607269" font-weight="500" >Keep a colleague’s newer changes from being overwritten.</text>
<rect x="36" y="174" width="888" height="365" rx="12" fill="#ffffff" stroke="#dfe7e1" stroke-width="1.5"/><text x="60" y="215" font-size="25" fill="#20362c" font-weight="650" >Sample Farmer 001 · record update</text><rect x="60" y="242" width="840" height="99" rx="10" fill="#fbf2df"/><circle cx="92" cy="278" r="15" fill="#906019"/><text x="92" y="284" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="122" y="279" font-size="24" fill="#906019" font-weight="650" >This record changed while you were editing.</text><text x="122" y="313" font-size="19" fill="#20362c" font-weight="500" >Review the latest saved version before trying again.</text><text x="60" y="382" font-size="15" fill="#607269" font-weight="550" >YOUR FORM VERSION</text><rect x="60" y="394" width="399" height="46" rx="8" fill="#ffffff" stroke="#7a9182" stroke-width="1.5"/><text x="74" y="424" font-size="19" fill="#20362c" font-weight="500" >Version 3 · sample</text><text x="482" y="382" font-size="15" fill="#607269" font-weight="550" >LATEST SAVED VERSION</text><rect x="482" y="394" width="418" height="46" rx="8" fill="#ffffff" stroke="#7a9182" stroke-width="1.5"/><text x="496" y="424" font-size="19" fill="#20362c" font-weight="500" >Version 4 · sample</text><rect x="60" y="477" width="243" height="40" rx="8" fill="#236344"/><text x="181.5" y="503" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">Reload latest record</text><text x="330" y="503" font-size="18" fill="#607269" font-weight="500" >Your changes have not been saved.</text>
<line x1="36" y1="558" x2="924" y2="558" stroke="#dfe7e1" stroke-width="2" /><text x="36" y="583" font-size="16" fill="#607269" font-weight="500" >Illustrated preview · fictional records</text><text x="924" y="583" font-size="14" fill="#236344" font-weight="650" text-anchor="end">NOT LIVE DATA</text>
</g></svg>
